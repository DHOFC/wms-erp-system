version: '3.8'

services:
  db:
    image: postgres:15
    container_name: wms_postgres
    restart: always
    environment:
      POSTGRES_USER: admin_wms
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: wms_erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: wms_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wms.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: